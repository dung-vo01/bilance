name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bilance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bilance_test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bilance_test
          SECRET_KEY: ci-test-secret
          JWT_SECRET_KEY: ci-test-jwt-secret
        run: pytest

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck & build
        run: npm run build

  deploy-frontend:
    needs: frontend-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Deploy to Vercel (production)
        run: npx vercel deploy --prod --token="$VERCEL_TOKEN" --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  deploy-frontend-aws:
    needs: frontend-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # Needed to request the OIDC token that AWS exchanges for temporary credentials.
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-frontend-aws
      cancel-in-progress: false
    env:
      AWS_REGION: eu-north-1
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Hashed bundles never change, so cache them for a year. Uploaded first, and
      # old ones are kept, so a page that still has the previous index.html open
      # during a deploy can still load its files.
      - name: Upload hashed assets
        working-directory: frontend
        run: >
          aws s3 sync dist/assets "s3://${{ vars.S3_BUCKET }}/assets"
          --cache-control "public,max-age=31536000,immutable"

      # Everything else (index.html, favicons, manifest) must be revalidated.
      - name: Upload index.html and other root files
        working-directory: frontend
        run: >
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}"
          --exclude "assets/*" --delete
          --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths "/index.html"

  deploy-backend-aws:
    needs: backend-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-backend-aws
      cancel-in-progress: false
    env:
      AWS_REGION: eu-north-1
      ECR_REPOSITORY: bilance-api
      INSTANCE_ID: ${{ vars.BACKEND_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          echo "REGISTRY=${REGISTRY}" >> "$GITHUB_ENV"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"

      # Two tags: the commit SHA (what gets deployed) and latest.
      - name: Build and push image
        run: |
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}"
          docker build -t "${IMAGE}:${GITHUB_SHA}" -t "${IMAGE}:latest" backend
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"

      # No SSH: the deploy script runs on the instance through SSM Run Command.
      - name: Deploy on the instance
        run: |
          IMAGE_REF="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          SCRIPT_B64="$(base64 -w0 infra/ec2/deploy.sh)"
          PARAMS="$(jq -cn --arg c "echo ${SCRIPT_B64} | base64 -d | bash -s -- ${IMAGE_REF}" '{commands: [$c]}')"
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "deploy ${GITHUB_SHA}" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)"
          status=0
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || status=$?
          echo "--- stdout ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text
          echo "--- stderr ---"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardErrorContent --output text
          exit "$status"
